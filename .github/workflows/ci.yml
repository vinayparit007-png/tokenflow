name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Offline suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # 22.5+ is required for the built-in node:sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # live shape tests self-skip without TOKENFLOW_LIVE
      - run: npm run build
